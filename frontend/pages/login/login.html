<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Connexion - Vite &amp; Gourmand</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div id="navbar"></div>
    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <h1>Connexion</h1>
                    <p class="auth-subtitle">Accédez à votre espace personnel</p>
                    <form id="loginForm" class="auth-form">
                        <div id="errorMessage" class="error-message" style="display:none;"></div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="votre@email.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Mot de passe</label>
                            <input type="password" id="password" name="password" required placeholder="Votre mot de passe">
                        </div>
                        <button type="submit" class="btn btn-primary btn-full" id="loginButton">Se connecter</button>
                    </form>
                    <div class="auth-links">
                        <p>Pas encore de compte ? <a href="../register/register.html">Créer un compte</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>

    <script>window.ROOT_PATH = "../../";</script>
    <script src="../../shared/api.js"></script>
    <script src="../../shared/footer-horaires.js"></script>
    <script src="../../shared/components.js"></script>
    <script src="login.js"></script>
</body>
</html>
