<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Compte - Vite &amp; Gourmand</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <div id="navbar"></div>
    <main>
        <section class="profile-section">
            <div class="container">
                <h1>Mon Espace Personnel</h1>
                <div class="profile-grid">
                    <div class="profile-card">
                        <h2>Mes Informations</h2>
                        <div id="profileInfo" class="profile-info">
                            <div class="loading">Chargement...</div>
                        </div>
                        <button class="btn btn-secondary" onclick="toggleEditMode()">Modifier mes informations</button>
                        <div id="editForm" style="display:none;">
                            <form id="updateProfileForm" class="profile-form">
                                <div class="form-group">
                                    <label>Prénom</label>
                                    <input type="text" id="editFirstname" required>
                                </div>
                                <div class="form-group">
                                    <label>Nom</label>
                                    <input type="text" id="editLastname" required>
                                </div>
                                <div class="form-group">
                                    <label>Téléphone</label>
                                    <input type="tel" id="editPhone">
                                </div>
                                <div class="form-group">
                                    <label>Adresse</label>
                                    <input type="text" id="editAddress">
                                </div>
                                <div class="form-group">
                                    <label>Ville</label>
                                    <input type="text" id="editCity">
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                                    <button type="button" class="btn btn-secondary" onclick="toggleEditMode()">Annuler</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="profile-card">
                        <h2>Mes Commandes</h2>
                        <div id="appointmentsList">
                            <div class="loading">Chargement des commandes...</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>

    <script>window.ROOT_PATH = "../../";</script>
    <script src="../../shared/api.js"></script>
    <script src="../../shared/auth.js"></script>
    <script src="../../shared/footer-horaires.js"></script>
    <script src="../../shared/components.js"></script>
    <script src="profile.js"></script>
</body>
</html>
