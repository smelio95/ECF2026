<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nos Services - Vite &amp; Gourmand</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <link rel="stylesheet" href="services.css">
</head>
<body>

    <div id="navbar"></div>
    <main>
        <section class="page-header">
            <div class="container">
                <h1>Nos Services de Restauration</h1>
                <p>Découvrez nos menus personnalisés pour tous vos événements</p>
            </div>
        </section>

        <section class="services-section">
            <div class="container">
                <div class="filters-section">
                    <h2>Filtrer les services</h2>
                    <div class="filters-grid">
                        <div class="filter-group">
                            <label for="priceMax">Prix maximum (€)</label>
                            <input type="number" id="priceMax" placeholder="Ex: 100">
                        </div>
                        <div class="filter-group">
                            <label for="themeFilter">Thème</label>
                            <select id="themeFilter">
                                <option value="">Tous les thèmes</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="regimeFilter">Régime</label>
                            <select id="regimeFilter">
                                <option value="">Tous les régimes</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <button class="btn btn-primary"   onclick="applyFilters()">Appliquer les filtres</button>
                            <button class="btn btn-secondary" onclick="resetFilters()">Réinitialiser</button>
                        </div>
                    </div>
                </div>
                <div class="services-results">
                    <h2 id="resultsTitle">Tous nos services</h2>
                    <div class="services-grid" id="servicesGrid">
                        <div class="loading">Chargement des services...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>

    <script>window.ROOT_PATH = "../../";</script>
    <script src="../../shared/api.js"></script>
    <script src="../../shared/auth.js"></script>
    <script src="../../shared/footer-horaires.js"></script>
    <script src="../../shared/components.js"></script>
    <script src="services.js"></script>
</body>
</html>
