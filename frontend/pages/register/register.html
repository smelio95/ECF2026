<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Inscription - Vite &amp; Gourmand</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div id="navbar"></div>
    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <h1>Créer un compte</h1>
                    <p class="auth-subtitle">Rejoignez Vite &amp; Gourmand pour réserver nos services</p>
                    <form id="registerForm" class="auth-form">
                        <div id="errorMessage"   class="error-message"   style="display:none;"></div>
                        <div id="successMessage" class="success-message" style="display:none;"></div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstname">Prénom *</label>
                                <input type="text" id="firstname" required placeholder="Jean">
                            </div>
                            <div class="form-group">
                                <label for="lastname">Nom *</label>
                                <input type="text" id="lastname" required placeholder="Dupont">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" required placeholder="jean.dupont@example.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Mot de passe *</label>
                            <input type="password" id="password" required placeholder="Minimum 8 caractères">
                            <small>Le mot de passe doit contenir au moins 8 caractères</small>
                        </div>
                        <div class="form-group">
                            <label for="phone">Téléphone</label>
                            <input type="tel" id="phone" placeholder="06 12 34 56 78">
                        </div>
                        <button type="submit" class="btn btn-primary btn-full" id="registerButton">Créer mon compte</button>
                    </form>
                    <div class="auth-links">
                        <p>Vous avez déjà un compte ? <a href="../login/login.html">Se connecter</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>

    <script>window.ROOT_PATH = "../../";</script>
    <script src="../../shared/api.js"></script>
    <script src="../../shared/footer-horaires.js"></script>
    <script src="../../shared/components.js"></script>
    <script src="register.js"></script>
</body>
</html>
